[colors]
; Глубокий темный фон с 80% прозрачности (под цвет дыма на обоях)
background = #CC111216
; Чуть более светлый фон для выделения элементов
background-alt = #DD1A1B26
; Яркий неоново-фиолетовый для текстовых кнопок и контуров
primary = #BC71FF
; Сочный ядовито-розовый для важных статусов (как румянец Бойкиссера)
secondary = #FF5E97
; Светло-розовый/белый для обычного текста и часов
foreground = #F7E3EC
; Цвет для мута/ошибок
alert = #FF4A4A
; Разделители (приглушенный фиолетово-серый)
disabled = #4C4B63

[bar/example]
; Идеальный размер для парящего дока на 1366x768
width = 85%
height = 22pt
offset-x = 7.5%
offset-y = 8pt
radius = 12
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

; Тонкая неоновая граница вокруг дока под цвет primary (фиолетовый)
border-size = 2pt
border-color = ${colors.primary}

padding-left = 3
padding-right = 3
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace:size=10;2

modules-left = app-terminal app-browser app-files xwindow
modules-right = xkeyboard pulseaudio
; date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = true
wm-restack = generic

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt
tray-size = 16

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/app-terminal]
type = custom/text
format = "   [TERM]"
format-foreground = ${colors.primary}
click-left = kitty &

[module/app-browser]
type = custom/text
format = "   [WEB]"
format-foreground = ${colors.secondary}
click-left = firefox &

[module/app-files]
type = custom/text
format = "   [FILE]"
format-foreground = ${colors.foreground}
click-left = thunar &
